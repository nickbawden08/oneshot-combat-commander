<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-Shot Combat Commander</title>
<link rel="manifest" href="manifest.json">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f14;
  color: #f5f5f5;
}

header {
  background: #1c1c26;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  letter-spacing: 2px;
  border-bottom: 2px solid crimson;
}

button {
  background: crimson;
  color: white;
  border: none;
  padding: 8px 12px;
  margin: 5px 0;
  border-radius: 6px;
}

.card {
  background: #1a1a22;
  margin: 10px;
  padding: 10px;
  border-left: 4px solid crimson;
  border-radius: 8px;
}

.current {
  border-left: 4px solid gold;
}

input {
  width: 90%;
  margin: 5px 0;
  padding: 6px;
  background: #121217;
  border: 1px solid #333;
  color: white;
}
</style>
</head>
<body>

<header>⚔ One-Shot Combat Commander</header>

<div style="padding:10px;">
<h3>Add Creature</h3>
<input id="name" placeholder="Name">
<input id="hp" type="number" placeholder="HP">
<input id="ac" type="number" placeholder="AC">
<button onclick="addCreature()">Add</button>
</div>

<div style="padding:10px;">
<button onclick="nextTurn()">Next Turn</button>
<h3>Round: <span id="round">1</span></h3>
</div>

<div id="creatures"></div>

<script>
let creatures = [];
let turn = 0;
let round = 1;

function addCreature() {
  let name = document.getElementById("name").value;
  let hp = parseInt(document.getElementById("hp").value);
  let ac = parseInt(document.getElementById("ac").value);
  creatures.push({name, hp, ac});
  render();
}

function nextTurn() {
  if (creatures.length === 0) return;
  turn++;
  if (turn >= creatures.length) {
    turn = 0;
    round++;
    document.getElementById("round").innerText = round;
  }
  render();
}

function damage(index) {
  let dmg = prompt("Enter damage:");
  if (!dmg) return;
  creatures[index].hp -= parseInt(dmg);
  if (creatures[index].hp < 0) creatures[index].hp = 0;
  render();
}

function render() {
  let container = document.getElementById("creatures");
  container.innerHTML = "";
  creatures.forEach((c, i) => {
    container.innerHTML += `
      <div class="card ${i === turn ? 'current' : ''}">
        <strong>${c.name}</strong><br>
        HP: ${c.hp} | AC: ${c.ac}<br>
        <button onclick="damage(${i})">Damage</button>
      </div>
    `;
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
